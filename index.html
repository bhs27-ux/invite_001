<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Our Wedding Journey</title>
  
  <!-- External Stylesheet -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <a href="#main-content" class="skip-link">Skip to content</a>

  <!-- Entry Overlay to bypass Chrome Autoplay Restriction -->
  <div id="invitation-overlay">
    <h1 id="invitation-overlay-greeting">Please Wait!</h1>
    <!--<p>You are invited to our wedding</p>-->
    <button class="invitation-overlay-open-btn" onclick="openInvitation()">Open Invitation</button>
  </div>

  <!-- Native HTML Audio Element (Hidden) -->
  <audio id="bg-audio" loop preload="auto">
    <source src="audio/song.mpeg" type="audio/mpeg">
    Your browser does not support the audio element.
  </audio>

  <!-- Floating Audio Controls Widget -->
  <div class="audio-player-widget" aria-label="Background Music Controls">
    <button id="audio-toggle-btn" class="audio-btn" onclick="toggleAudio()" aria-label="Play Music">▶</button>
    <span id="audio-label-text">Play Background Music</span>
  </div>

  <header class="hero-header">
    <img src="images/BriDe.jpg" alt="BriDe Background" class="hero-BriDe">
	<div class="hero-overlay">
      <h1> </h1>
      <p> </p>
    </div>
  </header>

  <main id="main-content">
    
    <section class="intro-section" aria-label="Welcome Note">
      <img src="images/RSVPHeader.png" alt="Header" class="hero-BriDe">
    </section>

    <!-- PERSONALIZED RSVP & SCHEDULE SECTION (Hidden by default, shown via URL Parameter) -->
    <section aria-label="Wedding Events & RSVP Portal">
      
      <!-- Dynamic Greeting Header -->
      <div id="rsvp-header" class="rsvp-card" style="display: none;">
        <h3 id="rsvp-greeting">Hello!</h3>
        <p id="rsvp-subtext"></p>
      </div>

      <div class="events-container">
        
        <!-- 1. HOLY MATRIMONY CARD (MORNING) -->
        <article id="matrimony-card" class="event-card" style="display: none;">
          
		<div class="event-card-wrapper">
			<img src="images/Matrimony.png" alt="Gereja Roh Kudus" style="width: 100%; height: auto;">
			<div class="rsvp-btn-container matrimony-button-container">
				<button onclick="submitEventRSVP('morning', 'Yes')" class="rsvp-btn btn-yes">Accept</button>
				<button onclick="submitEventRSVP('morning', 'No')" class="rsvp-btn btn-no">Decline</button>
			</div>
		</div>
		  
          <!-- Morning RSVP Controls -->
          <div class="rsvp-block">
            <p id="matrimony-status" class="status-text"></p>
          </div>
        </article>

        <!-- 2. RECEPTION CARD (EVENING) -->
        <article id="reception-card" class="event-card" style="display: none;">
		
		  <div class="event-card-wrapper">
			<img src="images/Reception.png" alt="Hotel Novotel" style="width: 100%; height: auto;">
			<div class="rsvp-btn-container reception-button-container">
				<button onclick="submitEventRSVP('evening', 'Yes')" class="rsvp-btn btn-yes">Accept</button>
				<button onclick="submitEventRSVP('evening', 'No')" class="rsvp-btn btn-no">Decline</button>
			</div>
		  </div>

          <!-- Evening RSVP Controls -->
          <div class="rsvp-block">
            <p id="reception-status" class="status-text"></p>
          </div>
        </article>

      </div>

      <!-- Global Feedback Message -->
      <p id="rsvp-global-status" aria-live="polite" class="global-status"></p>
      
      <!-- 3. Personal Greeting Submission Card -->
      <div id="greeting-input-card" class="rsvp-card" style="display: none;">
	    <img src="images/Wish-headline.png" alt="Wish Background" class="hero-BriDe">
        <h3>Leave a Wish for the Couple</h3>
        <textarea id="guest-greeting-text" rows="4" placeholder="Write your warm wishes here..."></textarea>
        <button onclick="submitGreeting()" class="rsvp-btn btn-yes" style="margin-top: 10px;">Send Wish</button>
        <p id="greeting-status" class="status-text" style="margin-top: 10px;"></p>
      </div>

    </section>
    
    <!-- 4. Public Greetings Wall (Visible to Everyone) -->
    <section aria-label="Wishes from Guests" style="margin: 40px auto;">
	  <img src="images/Wall-headline.png" alt="Wall Background" class="hero-BriDe">
      <!--<h3 style="text-align: center; color: var(--primary-color); margin-bottom: 20px;">Wishes & Blessings</h3>-->
      <div id="greetings-wall" class="greetings-wall-container">
        <p style="text-align: center; color: #718096;">Loading wishes...</p>
      </div>
    </section>

    <section aria-label="Photo Album Galleries">
      <div class="album-grid">
        
        <article class="album-item">
          <img src="images/DSC09503.jpg" alt="Bri and Dwi walking down the aisle under hanging white floral arrangements.">
          <div class="album-caption">The Ceremony</div>
        </article>

        <article class="album-item">
          <img src="images/DSC09503.jpg" alt="Guests dancing laughing inside a brightly lit tent at nighttime.">
          <div class="album-caption">The Reception</div>
        </article>

        <article class="album-item">
          <img src="images/DSC09503.jpg" alt="A close up view of the tiered wedding cake decorated with gold leaf accents.">
          <div class="album-caption">Details & Design</div>
        </article>

      </div>
    </section>
	
	<section aria-label="The Details">
		<div style="height: 50px;"></div>
		<img src="images/TheDetails.png" alt="Details Background" class="hero-BriDe">
	</section>
	
	<section aria-label="The Details 2">
		<div>
		<p style="text-align: center; color: #718096;"> </p>
		</div>
	</section>

  </main>

  <footer>
    <p>Made with love. Hosted forever.</p>
  </footer>

  <!-- External JavaScript -->
  <script src="js/script.js"></script>
</body>
</html>
